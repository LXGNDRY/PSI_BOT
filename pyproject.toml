[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legendary-theme-generator"
version = "1.0.0"
description = "Premium Shopify OS 2.0 theme generator engine — manifest-driven, Theme Store compliant, production-grade"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Legendary Branding", email = "engineering@legendary-branding.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
legendary = "legendary_themes.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["legendary_themes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
