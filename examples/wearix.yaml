# Legendary Theme Generator — Wearix Theme
# Pixel-accurate recreation of the Wearix Framer template for Shopify.
#
# Run: legendary generate examples/wearix.yaml -o ./wearix-theme

name: "Wearix"
author: "Legendary Branding"
version: "1.0.0"
vertical: "fashion"
default_preset: 0

presets:
  - name: "Wearix Light"
    palette:
      primary: "#000000"
      secondary: "#F7F7F7"
      accent: "#000000"
      background: "#FFFFFF"
      surface: "#F7F7F7"
      text: "#000000"
      text_muted: "#707070"
      border: "#E5E5E5"
      success: "#34C759"
      warning: "#FF9500"
      error: "#FF3B30"
    typography:
      heading_font: "inter_n5"
      body_font: "inter_n4"
      base_font_size: 16
      heading_scale: 1.2
      body_line_height: 1.5
    spacing:
      base_unit: 4
      section_padding: 120
      grid_gap: 24

features:
  header:
    style: "standard"
    sticky: true
    show_search: true
    show_cart: true
    show_account: true
    announcement_bar: true

  product:
    card_style: "classic"
    image_ratio: "portrait"
    show_vendor: false
    show_rating: false
    quick_add: true
    quick_view: false
    sticky_add_to_cart: true
    swatches: false
    layout: "stacked"

  cart:
    style: "drawer"
    ajax: true
    show_savings: true
    upsell_products: false

  nav:
    mobile_style: "drawer"
    mega_menu: false
    multi_level: 2

  search:
    predictive: false
    show_images: true
    show_prices: true
    result_types: ["product", "collection", "page", "article"]

  filters:
    enabled: true
    price_range: true
    availability: true
    product_type: true
    vendor: false
    variant_options: true

  reviews: false
  wishlist: false
  compare: false
  breadcrumbs: true
  recently_viewed: false
  countdown_timer: false
  image_zoom: true
  newsletter: true
  social_icons: true

performance:
  lazy_load_images: true
  preconnect_fonts: true
  inline_critical_css: false
  defer_non_critical_css: true
  js_budget_kb: 20
  css_budget_kb: 25
  lcp_target_ms: 1800
  cls_target: 0.02
  image_dimensions_required: true
  min_responsive_images: true

accessibility:
  skip_link: true
  focus_outlines: true
  reduced_motion: true
  semantic_headings: true
  landmark_roles: true
  aria_labels: true
  alt_text_required: true
  color_contrast_check: true
  keyboard_nav: true
  screen_reader_text: true
  form_labels: true
  error_announcements: true
